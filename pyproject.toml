[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "secureteam-messenger"
version = "2.0.0"
description = "Educational PyQt5 TCP messenger with SQLite persistence and server-side RBAC"
requires-python = ">=3.11,<3.14"
dependencies = ["PyQt5==5.15.11", "argon2-cffi==25.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff==0.14.14", "pip-audit>=2.9,<3", "cryptography>=46,<47"]

[tool.setuptools]
py-modules = ["run_client", "run_server"]

[tool.setuptools.packages.find]
include = ["client*", "server*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt5"
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning", "error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
